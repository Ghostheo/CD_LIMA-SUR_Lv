<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status CD LIMA SUR - FIX CLICKS</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-3 bg-gray-100">
<h1 class="font-black text-xl mb-2">TEST CLICKS - Si esto funciona, es la librería</h1>

<div class="bg-white p-3 rounded-xl mb-3 flex gap-2">
<button onclick="alert('ADMIN DA CLICK ✅')" class="bg-black text-white px-4 py-2 rounded">🔒 ADMIN DASHBOARD</button>
<button onclick="alert('GUARDAR DA CLICK ✅')" class="bg-green-600 text-white px-4 py-2 rounded">📥 GUARDAR DÍA</button>
<button onclick="testLimpiar()" class="bg-red-600 text-white px-4 py-2 rounded">LIMPIAR</button>
<button onclick="testAgregar()" class="bg-blue-700 text-white px-4 py-2 rounded">+ Agregar Unidad</button>
<button onclick="testExcel()" class="bg-green-700 text-white px-4 py-2 rounded">Exportar Excel</button>
</div>

<div class="bg-white p-3 rounded-xl">
<table class="w-full text-[11px]" id="tabla"><tbody id="tbodyPrincipal"><tr><td>1</td><td>A1Q159</td></tr><tr><td>2</td><td>B2C456</td></tr></tbody></table>
</div>

<script>
function testLimpiar(){
  if(confirm('¿Borrar todo lo de abajo?\n\nOK = BORRAR\nCANCELAR = NO BORRAR')){
    document.getElementById('tbodyPrincipal').innerHTML='';
    alert('Borrado ✅');
  } else {
    alert('Cancelado');
  }
}
function testAgregar(){alert('Agregar Unidad DA CLICK ✅');}
function testExcel(){alert('Excel DA CLICK ✅ - luego le pongo colores');}
function abrirAdminPass(){alert('Admin Pass DA CLICK ✅');}
</script>

<hr class="my-6">

<!-- AHORA EL CÓDIGO REAL COMPLETO PERO SIN LIBRERÍAS QUE ROMPEN -->
<div class="bg-white rounded-xl shadow p-4 flex justify-between items-center mb-3">
<div><h1 class="text-xl font-black">Status CD LIMA SUR</h1><p id="fechaHeader" class="text-[11px] text-gray-500"></p></div>
<div class="flex gap-2 border-2 border-red-600 p-2 rounded-lg">
<button onclick="abrirAdminReal()" class="border-2 border-gray-800 rounded-xl px-4 py-2 text-[13px] font-bold bg-white">🔒 ADMIN DASHBOARD</button>
<button onclick="guardarDiaReal()" class="bg-green-600 text-white rounded-xl px-5 py-2 text-[13px] font-bold">📥 GUARDAR DÍA</button>
</div>
</div>

<div class="bg-white rounded-xl shadow p-3 mb-3">
<div class="grid grid-cols-4 gap-3"><div class="bg-black text-white rounded-xl p-3 text-center font-bold">TOTAL<br><span id="cTotal" class="text-2xl">2</span></div><div class="bg-green-700 text-white rounded-xl p-3 text-center font-bold">ATENDIDO<br><span id="cAtend" class="text-2xl">2</span></div></div>
</div>

<div class="bg-white rounded-xl shadow p-3">
<div class="flex gap-2 mb-2">
<input id="buscador" placeholder="Buscar..." class="border text-[11px] px-3 py-1 rounded w-64">
<button onclick="limpiarTodoReal()" class="bg-red-600 text-white text-[10px] px-3 py-1.5 rounded font-bold">LIMPIAR</button>
<button onclick="abrirModalReal()" class="bg-blue-700 text-white text-[10px] px-3 py-1.5 rounded font-bold">+ Agregar Unidad</button>
<button onclick="exportarExcelReal()" class="bg-green-700 text-white text-[10px] px-3 py-1.5 rounded font-bold">Exportar a Excel</button>
</div>
<div class="overflow-x-auto border max-h-[300px]">
<table class="w-full"><thead><tr><th class="bg-yellow-400 p-2 text-[10px]">P</th><th class="bg-yellow-400 p-2 text-[10px]">PL. TRACTO</th><th class="bg-yellow-400 p-2 text-[10px]">STATUS</th><th class="bg-yellow-400 p-2 text-[10px]">ACCIONES</th></tr></thead><tbody id="tbodyReal"><tr><td class="p-2 text-[11px]">1</td><td class="p-2 text-[11px]">A1Q159</td><td class="p-2 text-[11px]">ATENDIDO</td><td class="p-2"><button onclick="this.closest('tr').remove()" class="bg-red-600 text-white text-[9px] px-2 py-1 rounded">Eliminar</button></td></tr></tbody></table>
</div>
</div>

<div id="modalAgregarReal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center"><div class="bg-white p-5 rounded-xl w-96"><h3 class="font-black mb-3">Agregar Unidad</h3><input id="fTractoReal" placeholder="PL. TRACTO" class="border p-2 rounded w-full mb-2"><button onclick="guardarReal()" class="bg-blue-700 text-white w-full py-2 rounded">GUARDAR</button><button onclick="document.getElementById('modalAgregarReal').classList.add('hidden')" class="w-full mt-2">Cerrar</button></div></div>
<div id="modalAdminReal" class="fixed inset-0 bg-black/60 hidden z-50 p-4"><div class="bg-white p-4 rounded-xl"><h2 class="font-black">ADMIN DASHBOARD - 2 carpetas</h2><p class="text-[11px]">1. TAT DIARIO META 01:10:00</p><p class="text-[11px]">2. PROM CICLO TOTAL SEMANAL</p><button onclick="document.getElementById('modalAdminReal').classList.add('hidden')" class="bg-black text-white px-4 py-1 rounded mt-3">Cerrar</button></div></div>

<script>
document.getElementById('fechaHeader').innerText = new Date().toLocaleString('es-PE');

function abrirModalReal(){document.getElementById('modalAgregarReal').classList.remove('hidden')}
function abrirAdminReal(){var pass=prompt('Clave:');if(pass==='Lavoro2026'){document.getElementById('modalAdminReal').classList.remove('hidden')}else alert('Clave incorrecta')}
function guardarDiaReal(){alert('Día guardado ✅ (luego va a histórico)')}
function limpiarTodoReal(){if(confirm('¿Estás seguro que deseas LIMPIAR todo lo llenado abajo?\n\nOK = BORRAR\nCANCELAR = NO BORRAR')){document.getElementById('tbodyReal').innerHTML='';document.getElementById('cTotal').innerText='0';document.getElementById('cAtend').innerText='0';}}
function guardarReal(){var tracto=document.getElementById('fTractoReal').value;if(!tracto){alert('Digita placa');return}var tbody=document.getElementById('tbodyReal');var tr=document.createElement('tr');tr.innerHTML='<td class="p-2 text-[11px]">'+(tbody.rows.length+1)+'</td><td class="p-2 text-[11px]">'+tracto+'</td><td class="p-2 text-[11px]">ATENDIDO</td><td class="p-2"><button onclick="this.closest(`tr`).remove()" class="bg-red-600 text-white text-[9px] px-2 py-1 rounded">Eliminar</button></td>';tbody.appendChild(tr);document.getElementById('modalAgregarReal').classList.add('hidden');document.getElementById('fTractoReal').value='';document.getElementById('cTotal').innerText=tbody.rows.length;}
function exportarExcelReal(){alert('Excel con colores te lo pongo en el siguiente paso, primero confirma que ya te da click todo');}
</script>

</body>
</html>
